<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — jars</title>
<meta name="description" content="A soft, romantic savings planner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Forgot password</p>
  <h1>Send me a <em>link</em></h1>
  <p class="sub">We'll email a link to set a new password. It works once, and expires shortly.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links"><a href="login.html">Back to log in</a></div>
</main>

<script src="auth.js"></script>
<script>
  document.getElementById('mark').innerHTML = JAR_SVG;
  redirectIfLoggedIn();

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    clearSay(msg);
    if (!form.email.value.trim()) { say(msg, 'Please enter your email.'); return; }

    submitting(form, true, 'Sending…');
    try {
      const out = await auth('forgot-password', { email: form.email.value });
      // Deliberately the same answer whether or not that address has an account.
      say(msg, out.message, 'good');
      form.reset();
    } catch (err) { say(msg, err.message); }
    finally { submitting(form, false); }
  });
</script>
</body>
</html>
