<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — jars</title>
<meta name="description" content="A soft, romantic savings planner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Password reset</p>
  <h1>Choose a new <em>password</em></h1>
  <p class="sub">Every device signed in to this account will be signed out.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
    </div>
    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" required placeholder="Repeat it">
    </div>
    <button type="submit" class="btn btn-primary">Save new password</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links"><a href="login.html">Back to log in</a></div>
</main>

<script src="auth.js"></script>
<script>
  document.getElementById('mark').innerHTML = JAR_SVG;
  addPasswordReveals();

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const token = new URLSearchParams(location.search).get('token') || '';

  if (!token) {
    say(msg, 'That reset link is not valid. Ask for a new one from the login page.');
    submitting(form, true, 'Unavailable');
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    clearSay(msg);
    if (form.password.value !== form.confirm.value) {
      say(msg, 'Those two passwords do not match.'); return;
    }
    submitting(form, true, 'Saving…');
    try {
      await auth('reset-password', {
        token, password: form.password.value, confirm: form.confirm.value
      });
      say(msg, 'Password changed. Taking you to the login page…', 'good');
      setTimeout(() => { location.href = 'login.html'; }, 1400);
    } catch (err) { say(msg, err.message); submitting(form, false); }
  });
</script>
</body>
</html>
