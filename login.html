<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — jars</title>
<meta name="description" content="A soft, romantic savings planner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Welcome back</p>
  <h1>Open your <em>jars</em></h1>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links">
    <a href="forgot-password.html">Forgot password?</a>
    <a href="signup.html">Create an account</a>
  </div>
  <p class="foot">Accounts are saved in this browser only. They are not a secure login and do not sync to other devices.</p>
</main>

<script src="auth.js"></script>
<script>
  document.getElementById('mark').innerHTML = JAR_SVG;
  addPasswordReveals();
  redirectIfLoggedIn();

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', e => {
    e.preventDefault();
    clearSay(msg);
    const out = logIn(form.email.value, form.password.value);
    if (out.error) { say(msg, out.error); return; }
    location.href = 'index.html';
  });
</script>
</body>
</html>
