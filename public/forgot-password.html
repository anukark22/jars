<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — jars</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Forgot password</p>
  <h1>Send me a <em>link</em></h1>
  <p class="sub">We'll email a link to set a new password. It works once, and expires shortly.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links"><a href="/recover">Use a recovery code</a> · <a href="/login">Back to log in</a></div>
</main>

<script type="module">
import { JAR_SVG, api, say, clearSay, submitting } from '/auth.js';
document.getElementById('mark').innerHTML = JAR_SVG;

const form = document.getElementById('form');
const msg = document.getElementById('msg');

form.addEventListener('submit', async e => {
  e.preventDefault();
  clearSay(msg);
  const email = form.email.value.trim();
  if (!email) { say(msg, 'Please enter your email.'); return; }

  submitting(form, true, 'Sending…');
  try {
    const out = await api('/api/auth/forgot-password', { email });
    // Deliberately the same answer whether or not that address has an account.
    say(msg, out.message, 'good');
    form.reset();
  } catch (err) {
    say(msg, err.message);
  } finally {
    submitting(form, false);
  }
});
</script>
</body>
</html>
