<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use a recovery code — jars</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
<style>
  #code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          letter-spacing: 0.12em; text-transform: uppercase; }
</style>
<script>
/* Not served over http, so this is the file itself opened from disk (file:,
   or a data: snapshot of it). Nothing it needs can load, and the result looks
   broken rather than explaining itself. */
if (location.protocol !== 'http:' && location.protocol !== 'https:') {
  document.addEventListener('DOMContentLoaded', function () {
    document.body.style.cssText = 'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F9F1E8;color:#574144;font:15px/1.7 Georgia,serif';
    document.body.innerHTML =
      '<div style="max-width:430px;padding:34px;background:#FFFCF8;border:1px solid rgba(191,126,129,.3);border-radius:4px;text-align:center">' +
      '<p style="margin:0;font:500 .6rem/1 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9A5D61">Opened from disk</p>' +
      '<h1 style="font-size:1.8rem;font-weight:500;margin:10px 0 12px">Open jars through the <em style="color:#9A5D61">server</em></h1>' +
      '<p style="color:rgba(87,65,68,.66);margin:0 0 20px">This file was opened directly, so its styling and your jars can&rsquo;t load. The app has to be served to work.</p>' +
      '<p style="margin:0 0 18px"><a href="http://localhost:3000" style="display:inline-block;padding:13px 26px;border-radius:999px;background:#9A5D61;color:#F9F1E8;text-decoration:none;font:500 .6rem/1 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase">Go to localhost:3000</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:rgba(87,65,68,.66)">Not running? Start it with <code style="background:#F2E6DA;padding:2px 6px;border-radius:3px">npm run dev</code></p>' +
      '</div>';
  });
}
</script>
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Recovery code</p>
  <h1>Let me back <em>in</em></h1>
  <p class="sub">Enter the code you saved. It works once, then a fresh one is waiting for you in your account.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="code">Recovery code</label>
      <input type="text" id="code" name="code" required autocomplete="one-time-code"
             spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
    </div>
    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Set new password</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links"><a href="/forgot-password">Email me a link instead</a> · <a href="/login">Back to log in</a></div>
</main>

<script type="module">
import { JAR_SVG, api, say, clearSay, submitting, addPasswordReveals } from '/auth.js';
document.getElementById('mark').innerHTML = JAR_SVG;
addPasswordReveals();

const form = document.getElementById('form');
const msg = document.getElementById('msg');

form.addEventListener('submit', async e => {
  e.preventDefault();
  clearSay(msg);
  const password = form.password.value;
  if (password.length < 8) { say(msg, 'Use at least 8 characters.'); return; }
  if (password !== form.confirm.value) { say(msg, 'Those two passwords do not match.'); return; }

  submitting(form, true, 'Checking…');
  try {
    await api('/api/auth/recover', {
      email: form.email.value.trim(),
      code: form.code.value,
      password,
      confirm: form.confirm.value
    });
    say(msg, 'Password changed. Sending you to the login page…', 'good');
    setTimeout(() => { location.href = '/login'; }, 1400);
  } catch (err) {
    say(msg, err.message);
    submitting(form, false);
  }
});
</script>
</body>
</html>
