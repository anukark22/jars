<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — jars</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">Welcome back</p>
  <h1>Open your <em>jars</em></h1>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links">
    <a href="/forgot-password">Forgot password?</a>
    <a href="/signup">Create an account</a>
  </div>
</main>

<script type="module">
import { JAR_SVG, api, say, clearSay, submitting, offerImport, goNext } from '/auth.js';
document.getElementById('mark').innerHTML = JAR_SVG;

const form = document.getElementById('form');
const msg = document.getElementById('msg');

form.addEventListener('submit', async e => {
  e.preventDefault();
  clearSay(msg);
  const email = form.email.value.trim();
  const password = form.password.value;
  if (!email || !password) { say(msg, 'Please fill in both fields.'); return; }

  submitting(form, true, 'Checking…');
  try {
    const out = await api('/api/auth/login', { email, password });
    await offerImport(out.hasData);
    goNext('/');
  } catch (err) {
    say(msg, err.message);
    form.password.value = '';
    form.password.focus();
  } finally {
    submitting(form, false);
  }
});
</script>
</body>
</html>
