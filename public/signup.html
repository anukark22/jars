<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — jars</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
<style>
  .carry {
    background: var(--blush); border: 1px solid var(--line); border-radius: 3px;
    padding: 12px 14px; margin: 0 0 20px; font-family: var(--font-body);
    font-size: .82rem; line-height: 1.55; color: var(--plum); text-align: left;
  }
  .carry b { font-weight: 500; color: var(--rose-deep); }
</style>
<script>
/* Not served over http, so this is the file itself opened from disk (file:,
   or a data: snapshot of it). Nothing it needs can load, and the result looks
   broken rather than explaining itself. */
if (location.protocol !== 'http:' && location.protocol !== 'https:') {
  document.addEventListener('DOMContentLoaded', function () {
    document.body.style.cssText = 'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F9F1E8;color:#574144;font:15px/1.7 Georgia,serif';
    document.body.innerHTML =
      '<div style="max-width:430px;padding:34px;background:#FFFCF8;border:1px solid rgba(191,126,129,.3);border-radius:4px;text-align:center">' +
      '<p style="margin:0;font:500 .6rem/1 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9A5D61">Opened from disk</p>' +
      '<h1 style="font-size:1.8rem;font-weight:500;margin:10px 0 12px">Open jars through the <em style="color:#9A5D61">server</em></h1>' +
      '<p style="color:rgba(87,65,68,.66);margin:0 0 20px">This file was opened directly, so its styling and your jars can&rsquo;t load. The app has to be served to work.</p>' +
      '<p style="margin:0 0 18px"><a href="http://localhost:3000" style="display:inline-block;padding:13px 26px;border-radius:999px;background:#9A5D61;color:#F9F1E8;text-decoration:none;font:500 .6rem/1 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase">Go to localhost:3000</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:rgba(87,65,68,.66)">Not running? Start it with <code style="background:#F2E6DA;padding:2px 6px;border-radius:3px">npm run dev</code></p>' +
      '</div>';
  });
}
</script>
</head>
<body>
<main class="card">
  <div id="mark"></div>
  <p class="label">First time here</p>
  <h1>Start your <em>jars</em></h1>
  <p class="sub">Somewhere to save for the things you actually want.</p>
  <p class="carry" id="carry" hidden></p>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" required placeholder="Repeat it">
    </div>
    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
  <p class="msg" id="msg" hidden></p>
  <div class="links"><a href="/login">I already have an account</a></div>
</main>

<script type="module">
import { JAR_SVG, api, say, clearSay, submitting, addPasswordReveals, offerImport, readLocalData, goNext } from '/auth.js';
document.getElementById('mark').innerHTML = JAR_SVG;
addPasswordReveals();

/* Says up front what's waiting to be carried over, so making an account
   visibly keeps the work rather than looking like starting again. */
const waiting = readLocalData();
if (waiting) {
  const bits = [];
  const n = (c, one, many) => `<b>${c}</b> ${c === 1 ? one : many}`;
  if (waiting.jars.length) bits.push(n(waiting.jars.length, 'jar', 'jars'));
  if (waiting.wallet.length) bits.push(n(waiting.wallet.length, 'wallet entry', 'wallet entries'));
  if (waiting.savings.length) bits.push(n(waiting.savings.length, 'savings entry', 'savings entries'));
  const list = bits.length > 1 ? bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1] : bits[0];
  const carry = document.getElementById('carry');
  carry.innerHTML = `This browser is holding ${list} from before accounts existed. Create an account and we’ll offer to move it all across.`;
  carry.hidden = false;
}

const form = document.getElementById('form');
const msg = document.getElementById('msg');
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

form.addEventListener('submit', async e => {
  e.preventDefault();
  clearSay(msg);
  const email = form.email.value.trim();
  const password = form.password.value;
  const confirm = form.confirm.value;

  // caught here as well as on the server, so the answer is immediate
  if (!EMAIL_RE.test(email)) { say(msg, 'That email address does not look right.'); form.email.focus(); return; }
  if (password.length < 8) { say(msg, 'Use at least 8 characters for your password.'); form.password.focus(); return; }
  if (password !== confirm) { say(msg, 'Those two passwords do not match.'); form.confirm.focus(); return; }

  submitting(form, true, 'Creating…');
  try {
    await api('/api/auth/signup', { email, password, confirm });
    await offerImport(false);   // a brand new account is always empty
    goNext('/');
  } catch (err) {
    say(msg, err.message);
  } finally {
    submitting(form, false);
  }
});
</script>
</body>
</html>
